appId: com.feasibility.yemen
productName: برنامج إعداد دراسات الجدوى
copyright: Copyright © 2026
directories:
  output: dist
  buildResources: build
files:
  - electron/**/*
  - .next/standalone/**/*
  - .next/static/**/*
  - public/**/*
  - package.json
extraResources:
  - from: public/icons
    to: icons
win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
  icon: public/icons/icon-512.png
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: دراسات الجدوى
  installerIcon: public/icons/icon-512.png
  uninstallerIcon: public/icons/icon-512.png
  installerHeaderIcon: public/icons/icon-512.png
  languages:
    - Arabic
    - English
  menuCategory: Business
mac:
  target:
    - dmg
  icon: public/icons/icon-512.png
  category: public.app-category.business
linux:
  target:
    - AppImage
    - deb
  icon: public/icons/icon-512.png
  category: Office
